<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>My Fitness Coach</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- 👇 Link to your external CSS file -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>My Fitness Coach</h1>

  <div id="chat"></div>

  <form id="form">
    <input id="input" placeholder="Type your goal or ask a question..." autocomplete="off" />
    <button type="submit">Send</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const userId = localStorage.getItem('userId') || (localStorage.setItem('userId', crypto.randomUUID()), localStorage.getItem('userId'));

    function add(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      add('user', text);
      input.value = '';
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, message: text })
      });
      const j = await r.json();
      add('bot', j.reply || 'No reply.');
    });
  </script>
</body>
</html>
